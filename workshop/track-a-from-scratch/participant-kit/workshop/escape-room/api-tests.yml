name: api-tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOOLSHOP_EMAIL: ${{ secrets.TOOLSHOP_USER }}
      TOOLSHOP_PASSWORD: ${{ secrets.TOOLSHOP_PASSWORD }}
      TOOLSHOP_BASE_URL: https://api.practicesoftwaretesting.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright test --project=prod
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-reports/
